    SkippedEntity:
      type: object
      properties:
        entity_id:
          type: string
        reason:
          $ref: '#/components/schemas/ReasonEnum'
      required:
      - entity_id
      - reason
    SourceEnum:
      enum:
      - upload
      - github
      - bundled
      type: string
      description: |-
        * `upload` - Upload
        * `github` - Github
        * `bundled` - Bundled
    StageChanges:
      type: object
      properties:
        sonoff:
          $ref: '#/components/schemas/StagedChange'
        waveshare_p4:
          $ref: '#/components/schemas/StagedChange'
      required:
      - sonoff
      - waveshare_p4
    StageRequestRequest:
      type: object
      properties:
        release:
          type: string
          minLength: 1
          description: '"latest" or a release tag. The firmware_github_release setting
            when omitted.'
    StageResult:
      type: object
      properties:
        tag:
          type: string
        commit:
          type: string
        boards:
          $ref: '#/components/schemas/StageChanges'
      required:
      - boards
      - commit
      - tag
    Staged:
      type: object
      properties:
        sonoff:
          $ref: '#/components/schemas/StagedBoard'
        waveshare_p4:
          $ref: '#/components/schemas/StagedBoard'
      required:
      - sonoff
      - waveshare_p4
    StagedBoard:
      type: object
      properties:
        md5:
          type: string
          nullable: true
          description: md5 of the staged file; null if there is none.
        source:
          nullable: true
          description: |-
            Where the staged file came from, if the manager recorded it.

            * `upload` - Upload
            * `github` - Github
            * `bundled` - Bundled
          oneOf:
          - $ref: '#/components/schemas/SourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        tag:
          type: string
          nullable: true
        commit:
          type: string
          nullable: true
        staged_at:
          type: string
          format: date-time
          nullable: true
      required:
      - commit
      - md5
      - source
      - staged_at
      - tag
    StagedChange:
      type: object
      properties:
        before_md5:
          type: string
          nullable: true
        after_md5:
          type: string
        changed:
          type: boolean
      required:
      - after_md5
      - before_md5
      - changed
    TurnOnBehaviorEnum:
      enum:
      - color_temp
      - restore
      type: string
      description: |-
        * `color_temp` - color_temp
        * `restore` - restore
    UpToDate:
      type: object
      properties:
        sonoff:
          type: boolean
        waveshare_p4:
          type: boolean
      required:
      - sonoff
      - waveshare_p4
    ValidationError:
      type: object
      description: 'A 400 for a malformed body: {"detail": message}, or messages by
        field (one object per list item).'
      properties:
        detail:
          type: string
        non_field_errors:
          type: array
          items:
            type: string
    WeatherPrecipitationFormatEnum:
      enum:
      - mm
      - inch
      type: string
      description: |-
        * `mm` - mm
        * `inch` - inch
    WeatherWindSpeedFormatEnum:
      enum:
      - kmh
      - ms
      - mph
      - knots
      type: string
      description: |-
        * `kmh` - kmh
        * `ms` - ms
        * `mph` - mph
        * `knots` - knots
