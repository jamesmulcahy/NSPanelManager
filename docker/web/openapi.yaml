openapi: 3.0.3
info:
  title: NSPanelManager REST API
  version: '2'
  description: The /rest/v2/* API used by the web UI. Generated by drf-spectacular;
    see docker/web/generate_api.sh.
paths:
  /rest/v2/firmware:
    get:
      operationId: firmware_retrieve
      parameters:
      - in: query
        name: release
        schema:
          type: string
          minLength: 1
        description: Resolve this tag ("latest" too) instead of the firmware_github_release
          setting.
      - in: query
        name: releases
        schema:
          type: string
          minLength: 1
        description: Pass 1 to also list the newest 20 releases.
      tags:
      - firmware
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /rest/v2/firmware/stage:
    post:
      operationId: firmware_stage_create
      tags:
      - firmware
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /rest/v2/home_assistant/areas:
    get:
      operationId: list_home_assistant_areas
      tags:
      - home_assistant
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeAssistantArea'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/entity_candidates:
    get:
      operationId: list_home_assistant_entity_candidates
      parameters:
      - in: query
        name: include_groups
        schema:
          type: boolean
          default: false
        description: Also list light groups (lights that have an entity_id attribute).
      - in: query
        name: include_hidden
        schema:
          type: boolean
          default: false
        description: Also list entities hidden in Home Assistant.
      - in: query
        name: include_imported
        schema:
          type: boolean
          default: false
        description: Also list entities already imported into some room (see already_imported_room_id).
      tags:
      - home_assistant
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCandidates'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/ignored_areas:
    put:
      operationId: set_ignored_home_assistant_areas
      tags:
      - home_assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IgnoredAreasRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgnoredAreas'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/import:
    post:
      operationId: import_home_assistant_entities
      tags:
      - home_assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/labels:
    get:
      operationId: list_home_assistant_labels
      tags:
      - home_assistant
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeAssistantLabel'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/room_links:
    get:
      operationId: list_room_links
      tags:
      - home_assistant
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomLink'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
    put:
      operationId: update_room_links
      tags:
      - home_assistant
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoomLinkUpdateRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomLinkResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/home_assistant/rooms_from_areas:
    post:
      operationId: create_rooms_from_home_assistant_areas
      tags:
      - home_assistant
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoomFromAreaRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreatedRoom'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantDetail'
          description: ''
  /rest/v2/nspanels/{id}/settings:
    get:
      operationId: nspanels_settings_retrieve
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - nspanels
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelSettings'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelDetail'
          description: ''
    patch:
      operationId: nspanels_settings_partial_update
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - nspanels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNSPanelSettingsRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelSettings'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelSettingsErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSPanelDetail'
          description: ''
  /rest/v2/rooms:
    get:
      operationId: rooms_list
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      tags:
      - rooms
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
          description: ''
    post:
      operationId: rooms_create
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      tags:
      - rooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
    patch:
      operationId: reorder_rooms
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      tags:
      - rooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoomOrderRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
  /rest/v2/rooms/{id}:
    get:
      operationId: rooms_retrieve
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rooms
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
    patch:
      operationId: rooms_partial_update
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoomRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
    delete:
      operationId: rooms_destroy
      description: 'An APIView whose errors are {"status": "error", "message": ...}
        instead of {"detail": ...}.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rooms
      security:
      - {}
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomDetail'
          description: ''
  /rest/v2/settings:
    get:
      operationId: settings_retrieve
      tags:
      - settings
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
    patch:
      operationId: settings_partial_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BoardEnum:
      enum:
      - sonoff
      - waveshare_p4
      type: string
      description: |-
        * `sonoff` - sonoff
        * `waveshare_p4` - waveshare_p4
    BoardImage:
      type: object
      properties:
        md5:
          type: string
        size:
          type: integer
      required:
      - md5
      - size
    BoardImages:
      type: object
      properties:
        sonoff:
          $ref: '#/components/schemas/BoardImage'
        waveshare_p4:
          $ref: '#/components/schemas/BoardImage'
      required:
      - sonoff
      - waveshare_p4
    CodeEnum:
      enum:
      - bad_release
      - not_found
      - verification_failed
      - rate_limited
      - unreachable
      - download_failed
      type: string
      description: |-
        * `bad_release` - bad_release
        * `not_found` - not_found
        * `verification_failed` - verification_failed
        * `rate_limited` - rate_limited
        * `unreachable` - unreachable
        * `download_failed` - download_failed
    CreatedRoom:
      type: object
      properties:
        room_id:
          type: integer
        area_id:
          type: string
      required:
      - area_id
      - room_id
    DefaultNspanelTypeEnum:
      enum:
      - eu
      - us
      type: string
      description: |-
        * `eu` - eu
        * `us` - us
    Detail:
      type: object
      description: DRF's error body for a request it rejects before validation, e.g.
        invalid JSON or a failed CSRF check.
      properties:
        detail:
          type: string
      required:
      - detail
    DisplayModeEnum:
      enum:
      - lvgl
      type: string
      description: '* `lvgl` - lvgl'
    EnergyPowerSourceEnum:
      enum:
      - home_assistant_energy
      - entities
      - 'off'
      type: string
      description: |-
        * `home_assistant_energy` - home_assistant_energy
        * `entities` - entities
        * `off` - off
    EnergyPriceSourceEnum:
      enum:
      - home_assistant_energy
      - entity
      - fixed
      - 'off'
      type: string
      description: |-
        * `home_assistant_energy` - home_assistant_energy
        * `entity` - entity
        * `fixed` - fixed
        * `off` - off
    EntityCandidate:
      type: object
      properties:
        entity_id:
          type: string
        ha_name:
          type: string
          description: Home Assistant's friendly name.
        suggested_name:
          type: string
          description: ha_name without the room or area name in front; what the import
            should use unless the user edits it.
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        room_id:
          type: integer
        room_name:
          type: string
        area_id:
          type: string
        hidden:
          type: boolean
        is_group:
          type: boolean
        labels:
          type: array
          items:
            type: string
          description: Home Assistant label ids.
        already_imported_room_id:
          type: integer
          nullable: true
          description: The room that already holds this entity, if any.
      required:
      - already_imported_room_id
      - area_id
      - entity_id
      - entity_type
      - ha_name
      - hidden
      - is_group
      - labels
      - room_id
      - room_name
      - suggested_name
    EntityCandidates:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/EntityCandidate'
          description: Sorted by room order, then type (light, cover, media_player,
            thermostat), then suggested_name.
        entities_without_area:
          type: integer
          description: Supported entities with no area in Home Assistant that would
            otherwise be listed; they can't be placed in a room.
        excluded_by_label:
          type: integer
          description: Entities in linked rooms' areas left out because they carry
            a label of the home_assistant_sync_exclude_labels setting.
      required:
      - candidates
      - entities_without_area
      - excluded_by_label
    EntityTypeEnum:
      enum:
      - light
      - cover
      - media_player
      - thermostat
      type: string
      description: |-
        * `light` - light
        * `cover` - cover
        * `media_player` - media_player
        * `thermostat` - thermostat
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        board:
          allOf:
          - $ref: '#/components/schemas/BoardEnum'
          description: |-
            The board a verification failure is about.

            * `sonoff` - sonoff
            * `waveshare_p4` - waveshare_p4
      required:
      - code
      - message
    FirmwareStatus:
      type: object
      properties:
        repo:
          type: string
        release:
          type: string
          description: 'The release asked about: "latest", or a tag.'
        resolved:
          allOf:
          - $ref: '#/components/schemas/ResolvedRelease'
          nullable: true
          description: What the release is. null when GitHub could not be asked; see
            error.
        staged:
          $ref: '#/components/schemas/Staged'
        up_to_date:
          allOf:
          - $ref: '#/components/schemas/UpToDate'
          nullable: true
        releases:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseListItem'
          description: The newest 20 releases, newest first. Only with ?releases=1.
        error:
          allOf:
          - $ref: '#/components/schemas/ErrorDetail'
          nullable: true
      required:
      - error
      - release
      - repo
      - resolved
      - staged
      - up_to_date
    HomeAssistantArea:
      type: object
      properties:
        area_id:
          type: string
        name:
          type: string
        linked_room_id:
          type: integer
          nullable: true
          description: The room linked to this area, if any.
        ignored:
          type: boolean
          description: The user asked not to be offered this area as a new room.
      required:
      - area_id
      - ignored
      - linked_room_id
      - name
    HomeAssistantDetail:
      type: object
      description: DRF's error body for a request it rejects, e.g. a 502 from Home
        Assistant or a 400 for a duplicate area.
      properties:
        detail:
          type: string
      required:
      - detail
    HomeAssistantLabel:
      type: object
      properties:
        label_id:
          type: string
        name:
          type: string
      required:
      - label_id
      - name
    HomeAssistantLinkEnum:
      enum:
      - unset
      - linked
      - none
      type: string
      description: |-
        * `unset` - Unset
        * `linked` - Linked
        * `none` - None
    IgnoredAreas:
      type: object
      description: Unknown request fields are a 400.
      properties:
        area_ids:
          type: array
          items:
            type: string
            maxLength: 255
          description: The complete set of ignored areas; anything not listed stops
            being ignored.
      required:
      - area_ids
    IgnoredAreasRequest:
      type: object
      description: Unknown request fields are a 400.
      properties:
        area_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: The complete set of ignored areas; anything not listed stops
            being ignored.
      required:
      - area_ids
    ImportItemRequest:
      type: object
      description: Unknown request fields are a 400.
      properties:
        entity_id:
          type: string
          minLength: 1
          maxLength: 255
        room_id:
          type: integer
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          description: |-
            Must match the entity's Home Assistant domain: light, cover, media_player or climate (thermostat).

            * `light` - light
            * `cover` - cover
            * `media_player` - media_player
            * `thermostat` - thermostat
        friendly_name:
          type: string
          minLength: 1
          description: Leading and trailing whitespace is removed.
          maxLength: 255
      required:
      - entity_id
      - entity_type
      - friendly_name
      - room_id
    ImportRequestRequest:
      type: object
      description: Unknown request fields are a 400.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItemRequest'
          description: 'In the order they should be placed in each room: the order
            of the candidates table.'
      required:
      - items
    ImportResult:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/ImportedEntity'
        skipped:
