syntax = "proto3";

// Protobufs defined in this .proto file are used to communicate with the MQTTManager

message NSPanelConfig {
  string name = 1;
  int32 default_room = 2;
  enum NSPanelDefaultPage {
    HOME = 0;
    SCENES = 1;
    ENTITIES = 2;
  }
  NSPanelDefaultPage default_page = 3;
  int32 screensaver_activation_timeout = 4;
  int32 min_button_push_time = 5;
  int32 button_long_press_time = 6;
  int32 special_mode_trigger_time = 7;
  int32 special_mode_release_time = 8;
  int32 screen_dim_level = 9;
  int32 screensaver_dim_level = 10;

  // Make sure this is updated together with protobuf_mqttmanager
  enum NSPanelScreensaverMode {
    WEATHER_WITH_BACKGROUND = 0;
    WEATHER_WITHOUT_BACKGROUND = 1;
    DATETIME_WITH_BACKGROUND = 3;
    DATETIME_WITHOUT_BACKGROUND = 4;
    NO_SCREENSAVER = 5;
  }
  NSPanelScreensaverMode screensaver_mode = 11;
  bool show_screensaver_inside_temperature = 12;
  bool show_screensaver_outside_temperature = 13;
  bool clock_us_style = 14;
  bool use_fahrenheit = 15;
  bool is_us_panel = 16;

  message RoomInfo {
    int32 room_id = 1;
    repeated int32 entity_page_ids = 2;
    repeated int32 scene_page_ids = 3;
  }
  repeated RoomInfo room_infos = 17; // Allowed rooms

  bool reverse_relays = 18;
  bool relay1_default_mode = 19;
  bool relay2_default_mode = 20;
  int32 temperature_calibration = 21;

  // There are more button modes avaiable but those are handled by the manager and no the panel itself.
  // Only send modes that the panel itself can handle or simply tell the panel to tell the manager.
  enum NSPanelButtonMode {
    DIRECT = 0;
    FOLLOW = 1;
    NOTIFY_MANAGER = 2;
    THERMOSTAT_HEAT = 3;
    THERMOSTAT_COOL = 4;
    OPEN_ENTITY_PAGE = 5; // Open the entity page for buttonN_entity_page_topic. The relay is left alone.
  }
  NSPanelButtonMode button1_mode = 22;
  NSPanelButtonMode button2_mode = 25;

  repeated int32 global_scene_entity_page_ids = 30;
  bool optimistic_mode = 31;
  int32 raise_light_level_to_100_above = 32;
  int32 nspanel_id = 33;

  repeated int32 relay1_relay_group = 35;
  repeated int32 relay2_relay_group = 37;

  int32 default_light_brightess = 38; // Default brightness for lights when trying to turn on but the current brightness is 0

  bool locked_to_default_room = 39;

  string inside_temperature_sensor_mqtt_topic = 40; // The topic for an inside temperature sensor. If this is empty then no sensor is configured.

  int32 button1_lower_temperature = 41; // At what temperature should relay1 turn on (heating) or off (cooling) when in thermostat mode.
  int32 button1_upper_temperature = 42; // At what temperature should relay1 turn off (heating) or on (cooling) when in thermostat mode.
  int32 button2_lower_temperature = 43; // At what temperature should relay2 turn on (heating) or off (cooling) when in thermostat mode.
  int32 button2_upper_temperature = 44; // At what temperature should relay2 turn off (heating) or on (cooling) when in thermostat mode.

  // Sounds played by the panel buzzer, one entry per event. An event without an entry, or with an empty rtttl, is silent.
  // Panels ignore events they do not know about.
  enum NSPanelSoundEvent {
    TOUCH = 0;           // The screen was touched
    SCENE_ACTIVATED = 1; // A scene was triggered from the panel. Played instead of the TOUCH sound for that touch.
    SCENE_SAVED = 2;     // A scene was saved from the panel
    TIMER_FIRED = 3;     // A timer started on the panel finished. Repeated until dismissed.
  }
  message Sound {
    NSPanelSoundEvent event = 1;
    string rtttl = 2; // Melody in RTTTL format, ex. "touch:d=32,o=6,b=190:g6,16p,32c7"
  }
  repeated Sound sounds = 45;

  // POSIX TZ rule for the manager's timezone, ex. "CET-1CEST,M3.5.0,M10.5.0/3", for setenv("TZ", ...) and tzset().
  // Empty if the manager could not work it out, in which case show the time from the manager's status/time topic.
  string tz_posix = 46;

  // State topic of the entity whose page a button opens when buttonN_mode is OPEN_ENTITY_PAGE. Empty otherwise.
  string button1_entity_page_topic = 47;
  string button2_entity_page_topic = 48;

  // The look of a panel that draws its pages with LVGL (a terminal TFT, see docs/LVGL_PANEL_MODE.md). Empty means
  // the manager does not manage it: keep the panel's own saved value. Panels without LVGL ignore these.
  string lvgl_theme = 49;      // Palette: auto, dark, grey, ocean, dusk, aurora or peaks
  string lvgl_background = 50; // Page background: none, ocean, dusk, aurora or peaks

  // Extra screensaver cards. The screensaver keeps its clock at the top and rotates the area below it: the
  // weather (WEATHER_* modes) for screensaver_base_card_seconds, then each card here in order, for its own
  // seconds. Empty: the screensaver as before. Ignored with NO_SCREENSAVER, and by panels that do not draw
  // with LVGL. Panels skip card types they do not know.
  enum NSPanelScreensaverCardType {
    SCREENSAVER_CARD_UNSPECIFIED = 0;
    SCREENSAVER_CARD_CALENDAR = 1; // Upcoming events, from NSPanelCalendarUpdate on nspanel/mqttmanager_<address>/status/calendar
    SCREENSAVER_CARD_ENERGY = 2;   // Power draw as cost per day and lights on, from NSPanelEnergyUpdate on nspanel/mqttmanager_<address>/status/energy
    SCREENSAVER_CARD_NOW_PLAYING = 3; // The room's first media player, from its NSPanelEntityState on
                                      // screensaver_media_player_topic; shown only while it plays unmuted
  }
  message ScreensaverCard {
    NSPanelScreensaverCardType type = 1;
    int32 seconds = 2; // How long the card shows. 0: the panel's default (10 s)
  }
  repeated ScreensaverCard screensaver_cards = 51;
  int32 screensaver_base_card_seconds = 52; // How long the weather shows in WEATHER_* modes. 0: the panel's default (10 s)
  // State topic of the media player the now-playing card follows: the first media player in the panel's room.
  // Empty when the card isn't configured or the room has no media player (the panel then skips the card).
  string screensaver_media_player_topic = 53;
}

enum NSPanelWarningLevel {
  CRITICAL = 0;
  ERROR = 1;
  WARNING = 2;
  INFO = 3;
  DEBUG = 4;
  TRACE = 5;
}

message NSPanelWarning {
  NSPanelWarningLevel level = 1;
  string text = 2;
}

message NSPanelStatusReport {
  enum state {
    ONLINE = 0;
    OFFLINE = 1;
    UPDATING_TFT = 2;
    UPDATING_FIRMWARE = 3;
    UPDATING_LITTLEFS = 4;
    REBOOTING = 5;
  }
  state nspanel_state = 1;
  int32 update_progress = 2;
  int32 rssi = 3;
  int32 heap_used_pct = 4;
  string mac_address = 5;
  float temperature = 6;
  string ip_address = 7;

  repeated NSPanelWarning warnings = 8;

  string md5_firmware = 9;
  string md5_littlefs = 10;
  string md5_tft_gui = 11;

  bool has_humidity = 12;
  float humidity = 13;
  bool has_pressure = 14;
  float pressure = 15;

  // What the display shows. Firmware that does not report it leaves it UNKNOWN.
  enum NSPanelDisplayMode {
    DISPLAY_MODE_UNKNOWN = 0;
    DISPLAY_MODE_NEXTION = 1;       // A legacy TFT (NSPM's Nextion HMI TFT): the firmware has no UI for it and shows a "display update needed" screen
    DISPLAY_MODE_LVGL = 2;          // LVGL draws the pages through a terminal TFT
    DISPLAY_MODE_TERMINAL_IDLE = 3; // No UI: no terminal TFT is installed, the banner was missed, or LVGL failed to start. The display shows at most the TFT's own waiting page
  }
  NSPanelDisplayMode display_mode = 16;
  string lvgl_theme = 17;      // The palette in use in LVGL mode ("light" reported as "grey"), empty otherwise
  string lvgl_background = 18; // The page background in use in LVGL mode, empty otherwise

  // TCP port of the panel's Prometheus /metrics endpoint, 0 if it has none. Also sent in
  // register_request, but repeated here so a restarted manager relearns it from the next report.
  int32 metrics_port = 19;

  // True when `temperature` holds a real reading. A panel that has no valid reading yet (just booted, or the
  // sensor is failing) leaves it false and `temperature` at 0. Firmware that predates this field never sets it:
  // read a non-zero `temperature` from such a panel as present.
  bool has_temperature = 20;

  // Which build is running. Unset (not has_build) on firmware that predates it.
  BuildInfo build = 21;
}

// Identity of a firmware build, read from the running image's esp_app_desc_t and OTA partition.
// Also sent in register_request as a JSON "build" object with the same field names.
message BuildInfo {
  string version = 1;       // esp_app_desc_t.version, normally `git describe --always --tags --dirty`
  string project = 2;       // esp_app_desc_t.project_name
  string build_date = 3;    // esp_app_desc_t.date + " " + time
  string idf_version = 4;   // esp_app_desc_t.idf_ver
  string elf_sha256 = 5;    // esp_app_desc_t.app_elf_sha256, 64 lowercase hex characters
  string image_sha256 = 6;  // SHA-256 of the image in the running OTA partition (the .bin's last 32 bytes), 64 lowercase hex characters
  string chip = 7;          // "esp32", "esp32s3" or "esp32p4"
  string ota_partition = 8; // Label of the running partition: ota_0, ota_1 or factory
}

// Container of data shown on the "Entities page".
// When pressing the next or previous button on the panel it will request a new NSPanelRoomEnititesPage from the manager.
message NSPanelRoomEntitiesPage {
  int32 id = 1;
  int32 page_type = 2; // 12, 8 or 4 entities shown?
  string header_text = 3;

  message EntitySlot {
    int32 room_view_position = 1;
    string name = 2;
    string icon = 3;
    int32 pco = 4;
    int32 pco2 = 5;
    bool can_save_scene = 6;
    string mqtt_state_topic = 7; // MQTT topic where NSPanelEntityState is sent for control of individual entity. Empty if not controllable individually.

    enum EntityType {
      ENTITY_TYPE_UNSPECIFIED = 0;
      ENTITY_TYPE_LIGHT = 1;
      ENTITY_TYPE_SWITCH = 2;
      ENTITY_TYPE_BUTTON = 3;
      ENTITY_TYPE_THERMOSTAT = 4;
      ENTITY_TYPE_SCENE = 5;
      ENTITY_TYPE_MEDIA_PLAYER = 6;
      ENTITY_TYPE_COVER = 7;
    }
    EntityType type = 8;
    int32 id = 9;
  }

  repeated EntitySlot entities = 4;
}

// Data showed on the main page.
// When pressing "next room" it will request a new NSPanelRoomStatus from the manager.
message NSPanelRoomStatus {
  int32 id = 1;
  string name = 2;
  int32 average_dim_level = 3;
  int32 ceiling_lights_dim_level = 4;
  int32 table_lights_dim_level = 5;
  int32 average_color_temperature = 6;
  int32 ceiling_lights_color_temperature_value = 7;
  int32 table_lights_color_temperature_value = 8;
  // The lights controlled from the main page, in the room (or in every room, for "All rooms").
  // A panel hides a group's control when its count is 0; every manager that sends this message
  // sends these.
  int32 num_ceiling_lights = 9;
  int32 num_table_lights = 10;
  int32 num_ceiling_lights_on = 11;
  int32 num_table_lights_on = 12;

  repeated int32 entity_page_ids = 13;

  // How many of the lights counted in num_ceiling_lights and num_table_lights can change colour
  // temperature. The panel hides the colour-temperature slider when this is 0, but only if
  // color_temperature_lights_known is set: a manager from before these fields never sends either,
  // and a missing count must read as "not known" (show the slider, as panels always have), not as
  // "none". (Not proto3 `optional`: protoc-gen-c 1.4, which builds the firmware's code, can't.)
  int32 num_color_temperature_lights = 14;
  bool color_temperature_lights_known = 15;
}

message NSPanelWeatherUpdate {
  message ForecastItem {
    string weather_icon = 1;
    string precipitation_string = 2;
    string temperature_maxmin_string = 3;
    string wind_string = 4;
    string display_string = 5;
  }
  repeated ForecastItem forecast_items = 1;
  string current_weather_icon = 2;
  string current_temperature_string = 3;
  string current_maxmin_temperature = 4;
  string current_wind_string = 5;
  string sunrise_string = 6;
  string sunset_string = 7;
  string current_precipitation_string = 8;
}

// Upcoming calendar events, for the screensaver's calendar card. Published retained by the manager on
// nspanel/mqttmanager_<address>/status/calendar, one list for every panel.
message NSPanelCalendarUpdate {
  message Event {
    string summary = 1;     // The event's title, UTF-8, at most 64 bytes (cut on a character boundary)
    int64 start = 2;        // Unix seconds. All-day events: local midnight of the first day, in the manager's timezone
    int64 end = 3;          // Unix seconds, exclusive. All-day events: local midnight after the last day
    bool all_day = 4;
    string when_string = 5; // When it is, as the manager would show it ("Today 3:00 PM", "Tomorrow", "Sat 9:00 AM"), for panels whose clock is not set
  }
  repeated Event events = 1; // Events that have not ended, sorted by start, at most the manager's configured maximum
  int32 lookahead_hours = 2; // How far ahead the list looks, for "No events in the next 48 hours"
  int64 generated_at = 3;    // Unix seconds. Always set, so a list with no events never serialises to an empty payload
}

// The house's power draw, its cost per day and the number of lights on, for the screensaver's energy card. Published
// retained by the manager on nspanel/mqttmanager_<address>/status/energy, one for every panel. The panel formats the
// numbers.
message NSPanelEnergyUpdate {
  enum Availability {
    NOT_CONFIGURED = 0; // Not set up in the manager: the card leaves this part out
    UNAVAILABLE = 1;    // Set up, but there is no value now (a sensor is unavailable, Home Assistant is disconnected)
    AVAILABLE = 2;
  }
  Availability power = 1;
  int32 power_watts = 2;      // The whole house, rounded to 10 W. Negative: exporting
  Availability cost = 3;      // NOT_CONFIGURED without a price; otherwise follows `power`
  double cost_per_day = 4;    // What a whole day would cost at power_watts, in units of `currency`. Negative: a credit
  string currency = 5;        // ISO 4217 code, from Home Assistant ("USD")
  string currency_symbol = 6; // "$", "€", "£"; empty: show `currency` instead
  Availability lights = 7;
  int32 lights_on = 8;
  bool lights_alert = 9;      // lights_on is at or above the manager's threshold
  int64 generated_at = 10;    // Unix seconds. Always set, so an update never serialises to an empty payload
}

// Command send from NSPanel to MQTTManager
message NSPanelMQTTManagerCommand {
  enum AffectLightsOptions {
    ALL = 0;
    TABLE_LIGHTS = 1;
    CEILING_LIGHTS = 2;
  }
  message FirstPageTurnLightOn {
    AffectLightsOptions affect_lights = 1;
    int32 brightness_slider_value = 2;
    int32 kelvin_slider_value = 3;
    int32 selected_room = 4;
    bool global = 5;
    bool has_brightness_value = 6;
    bool has_kelvin_value = 7;
  }
  message FirstPageTurnLightOff {
    AffectLightsOptions affect_lights = 1;
    bool global = 2;
  }

  // TODO: Once protobuf-c-compiler gets updated, perhaps it's possible to build protobuf C files
  // with optional arguments.
  message LightCommand {
    repeated int32 light_ids = 1;
    bool has_brightness = 2;
    int32 brightness = 3; // Brightness in 0-100%
    bool has_color_temperature = 4;
    int32 color_temperature = 5; // Color temperature in 0-100%
    bool has_hue = 6;
    int32 hue = 7;
    bool has_saturation = 8;
    int32 saturation = 9;
  }

  message ToggleEntityFromEntitiesPage {
    int32 entity_page_id = 1;
    int32 entity_slot = 2;
  }

  message SaveSceneCommand {
    int32 entity_page_id = 1;
    int32 entity_slot = 2;
  }

  message ButtonPressed {
    int32 button_id = 2;
  }

  message ThermostatTemperatureCommand {
    int32 thermostat_id = 1;
    float temperature = 2;
  }

  message ThermostatCommand {
    int32 thermostat_id = 1;
    string option = 2;
    string new_value = 3;
  }

  message MediaPlayerCommand {
    enum PlaybackAction {
      NONE = 0;
      PLAY = 1;
      PAUSE = 2;
      NEXT_TRACK = 3;
      PREVIOUS_TRACK = 4;
    }

    int32 media_player_id = 1;
    PlaybackAction playback_action = 2;
    bool has_volume = 3;
    int32 volume = 4; // Volume in 0-100%
    bool has_source_volume = 5;
    int32 source_volume = 6; // Volume in 0-100%
    bool has_muted = 7;
    bool muted = 8;
    // Name of a source to select, as sent in the state's source lists. Empty means no change.
    string select_player_source = 9;
    string select_source_player_source = 10;
  }

  message CoverCommand {
    enum Action {
      NONE = 0;
      OPEN = 1;
      CLOSE = 2;
      STOP = 3;
      OPEN_TILT = 4;
      CLOSE_TILT = 5;
      STOP_TILT = 6;
    }

    int32 cover_id = 1;
    Action action = 2;

    bool has_position = 3;
    int32 position = 4; // 0 = closed, 100 = open

    bool has_tilt_position = 5;
    int32 tilt_position = 6; // 0-100
  }

  // A look chosen on the panel (LVGL mode), to be saved as the panel's lvgl_theme and lvgl_background.
  // The manager confirms it with a config that carries the same look (NSPanelConfig fields 49 and 50).
  message LvglLook {
    string theme = 1;      // auto, dark, grey, ocean, dusk, aurora or peaks
    string background = 2; // none, ocean, dusk, aurora or peaks
  }

  oneof CommandData {
    FirstPageTurnLightOn first_page_turn_on = 1;
    FirstPageTurnLightOff first_page_turn_off = 2;
    LightCommand light_command = 3;
    ToggleEntityFromEntitiesPage toggle_entity_from_entities_page = 4;
    SaveSceneCommand save_scene_command = 5;
    ButtonPressed button_pressed = 6;

    ThermostatTemperatureCommand thermostat_temperature_command = 7;
    ThermostatCommand thermostat_command = 8;
    MediaPlayerCommand media_player_command = 9;
    CoverCommand cover_command = 10;
    LvglLook lvgl_look = 11;
  }

  int32 nspanel_id = 100;
}
