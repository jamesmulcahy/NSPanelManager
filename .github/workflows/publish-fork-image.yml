name: "Publish fork image"

# Publishes the release image built from the top of the fork branch to Docker Hub, as
# jamesmulcahy/nspanelmanager:fork-latest and :fork-<short sha>, so a plain Docker install can
# follow the fork with `docker pull`. amd64 only.
#
# Needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets (a Docker Hub access token
# with read & write scope).

on:
  push:
    branches:
      - "fork"
    paths:
      - "docker/**"
      - ".github/workflows/publish-fork-image.yml"
  workflow_dispatch:

# Each merge supersedes the previous one's publish; fork-latest only ever needs the newest.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: docker.io/jamesmulcahy/nspanelmanager

jobs:
  publish:
    # A manual run from another branch would overwrite fork-latest with that branch.
    if: github.ref == 'refs/heads/fork'
    runs-on: ubuntu-latest
    # Building the Conan dependencies from source takes about an hour when the cache is cold.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tags
        id: meta
        run: |
          short_sha=${GITHUB_SHA::8}
          echo "version=fork-$short_sha" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:fork-latest"
            echo "$IMAGE:fork-$short_sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The placeholders release.yml fills in, so the web UI's About page shows the commit.
      - name: Set the version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sed -i "s/%version%/$VERSION/g" \
            docker/web/nspanelmanager/web/templates/about.html \
            docker/web/nspanelmanager/web/views.py

      - uses: docker/setup-buildx-action@v3
        id: buildx

      # Same key as docker-build.yml's amd64 job, so the two share one cache on the fork branch.
      - name: Cache Conan packages
        id: conan-cache
        uses: actions/cache@v4
        with:
          path: conan-cache
          key: docker-conan-amd64-${{ hashFiles('docker/MQTTManager/conanfile.py', 'docker/build_scripts/install_build_tools.sh') }}
          restore-keys: docker-conan-amd64-

      - name: Restore Conan cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "conan-cache": {
                "target": "/MQTTManager/conan_cache",
                "id": "nspm-conan",
                "sharing": "locked"
              }
            }
          skip-extraction: ${{ steps.conan-cache.outputs.cache-hit }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "Pushed \`$IMAGE:fork-latest\` and \`$IMAGE:${{ steps.meta.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
